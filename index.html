<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Підручники 10-Є клас</title>
<meta name="description" content="Усі підручники 10-Є класу на одній сторінці: великі кнопки, зручно на планшеті.">
<meta name="theme-color" content="#F2F3F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Nunito:wght@600;700;800;900&display=swap">
<script>
  /* Спільна логіка налаштувань. Викликається ще до першого малювання, щоб не було «блимання». */
  var PIDR = (function () {
    var KEY = 'pidruchnyky-settings';
    var defaults = { font: 'soft', theme: 'auto', layout: 'grid', size: 'normal', color: 'multi', radius: 'normal' };
    var RADII = { square: 6, small: 14, normal: 26, round: 40 };
    var FONTS = { soft: 1, strict: 1, pixel: 1 };

    function load() {
      var s = {};
      try { s = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
      for (var k in defaults) if (!s[k]) s[k] = defaults[k];
      if (!FONTS[s.font]) s.font = 'soft';              // старий «мультяшний» більше не існує
      if (!(s.radius in RADII)) s.radius = 'normal';
      if (s.color !== 'multi' && !/^#[0-9a-f]{6}$/i.test(s.color)) s.color = 'multi';
      return s;
    }
    function save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }

    function rgb(h) { return [parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)]; }
    function hex(c) { return '#' + c.map(function (v) { return ('0' + Math.round(v).toString(16)).slice(-2); }).join(''); }
    function mix(a, b, t) { a = rgb(a); b = rgb(b); return hex([0, 1, 2].map(function (i) { return a[i] + (b[i] - a[i]) * t; })); }

    function applyRoot(s) {
      var d = document.documentElement;
      if (s.theme === 'light' || s.theme === 'dark') d.setAttribute('data-theme', s.theme); else d.removeAttribute('data-theme');
      d.setAttribute('data-font', s.font);
      d.setAttribute('data-layout', s.layout);
      d.setAttribute('data-size', s.size);
      d.style.setProperty('--radius', RADII[s.radius] + 'px');
      if (s.color === 'multi') {
        d.removeAttribute('data-color');
      } else {
        // з одного кольору робимо пару «фон картки / колір іконки» для світлої і темної теми
        var c = s.color;
        d.setAttribute('data-color', 'uni');
        d.style.setProperty('--uni-bg-l', mix(c, '#ffffff', .78));
        d.style.setProperty('--uni-fg-l', mix(c, '#000000', .38));
        d.style.setProperty('--uni-bg-d', mix(c, '#0b0b0d', .74));
        d.style.setProperty('--uni-fg-d', mix(c, '#ffffff', .32));
      }
    }

    var s = load();
    applyRoot(s);
    return { s: s, save: save, applyRoot: applyRoot, rgb: rgb, hex: hex };
  })();
</script>
<style>
  @font-face {
    font-family: "Minecraft";
    src: url("fonts/Minecraft.ttf") format("truetype");
    font-weight: 400; font-style: normal; font-display: swap;
  }
  /* Макет: великий заголовок як в iOS, під ним кольорові картки-віджети; на планшеті 2–3 в ряд, на телефоні — 1.
     Анімації лише через transform і opacity (композитор GPU), без blur і анімованих тіней — легко навіть для слабких планшетів. */
  :root {
    --bg: #F2F3F7;
    --surface: #FFFFFF;
    --ink: #111317;
    --ink-soft: #6B7180;
    --line: #E1E4EB;
    --accent: #0A7CFF;
    --focus: #0A7CFF;
    --seg-bg: #E6E8EE;
    --seg-thumb: #FFFFFF;

    /* кольори предметів: фон картки / колір іконки */
    --hist-bg: #FFE3C2;  --hist-fg: #B4560A;
    --math-bg: #D6E4FF;  --math-fg: #1D5BD8;
    --tech-bg: #CDF1E3;  --tech-fg: #0B7A58;
    --lit-bg:  #F8D7E8;  --lit-fg:  #A62F6C;
    --ukr-bg:  #FFEFAE;  --ukr-fg:  #866100;

    /* один колір для всіх карток (вмикається в налаштуваннях; значення ставить скрипт) */
    --uni-bg: var(--uni-bg-l, #D6E4FF);
    --uni-fg: var(--uni-fg-l, #1D5BD8);

    --font-soft: "Nunito", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;
    --font-strict: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --font-pixel: "Minecraft", "Courier New", monospace;
    --font: var(--font-soft);
    --scale: 1;
    --radius: 26px;
    --radius-in: max(4px, calc(var(--radius) - 8px));
    --radius-ui: max(4px, calc(var(--radius) * .65));
    --spring: cubic-bezier(.32, 1.4, .56, 1);   /* легка «пружина» як в iOS */
    --ease-out: cubic-bezier(.22, 1, .36, 1);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000; --surface: #1C1C1F; --ink: #F5F6F8; --ink-soft: #9BA1AD; --line: #2C2D33;
      --accent: #3D96FF; --focus: #5AA7FF;
      --seg-bg: #2A2B30; --seg-thumb: #4A4C54;
      --hist-bg: #3D2710; --hist-fg: #FFAE5E;
      --math-bg: #172A50; --math-fg: #8FB4FF;
      --tech-bg: #0F3A2C; --tech-fg: #5FDDB1;
      --lit-bg:  #421A30; --lit-fg:  #FF92C6;
      --ukr-bg:  #3C3108; --ukr-fg:  #FFD84D;
      --uni-bg: var(--uni-bg-d, #172A50); --uni-fg: var(--uni-fg-d, #8FB4FF);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000; --surface: #1C1C1F; --ink: #F5F6F8; --ink-soft: #9BA1AD; --line: #2C2D33;
    --accent: #3D96FF; --focus: #5AA7FF;
    --seg-bg: #2A2B30; --seg-thumb: #4A4C54;
    --hist-bg: #3D2710; --hist-fg: #FFAE5E;
    --math-bg: #172A50; --math-fg: #8FB4FF;
    --tech-bg: #0F3A2C; --tech-fg: #5FDDB1;
    --lit-bg:  #421A30; --lit-fg:  #FF92C6;
    --ukr-bg:  #3C3108; --ukr-fg:  #FFD84D;
    --uni-bg: var(--uni-bg-d, #172A50); --uni-fg: var(--uni-fg-d, #8FB4FF);
    color-scheme: dark;
  }
  /* свій колір: ним же фарбуємо кнопку «Готово» і рамку фокуса */
  :root[data-color="uni"] { --accent: var(--uni-fg); --focus: var(--uni-fg); }
  :root[data-color="uni"] .book { --bg-card: var(--uni-bg); --fg: var(--uni-fg); }

  :root[data-font="strict"] { --font: var(--font-strict); }
  :root[data-font="pixel"]  { --font: var(--font-pixel); }
  :root[data-size="large"]  { --scale: 1.18; }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: calc(17px * var(--scale));
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
    padding-block: calc(env(safe-area-inset-top, 0px) + 24px) calc(env(safe-area-inset-bottom, 0px) + 32px);
  }
  :root[data-font="pixel"] body { -webkit-font-smoothing: none; }
  .wrap { flex: 1; width: 100%; max-width: 1180px; margin-inline: auto; display: flex; flex-direction: column; gap: 26px; }

  svg.i { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---------- шапка ---------- */
  header { display: flex; align-items: flex-end; gap: 16px; animation: fade .5s var(--ease-out) both; }
  .brand { flex: 1; min-width: 0; display: grid; gap: 0; }
  .brand small { font-size: calc(16px * var(--scale)); font-weight: 800; color: var(--ink-soft); }
  h1 {
    margin: 0; font-size: calc(clamp(34px, 6.4vw, 48px) * var(--scale)); line-height: 1.05;
    font-weight: 900; letter-spacing: -.02em; text-wrap: balance;
  }
  :root[data-font="strict"] h1 { font-weight: 800; letter-spacing: -.03em; }
  /* у шрифта Minecraft лише одне накреслення — без штучного «жирного», щоб пікселі лишались чіткими */
  :root[data-font="pixel"] body { font-synthesis: none; }
  :root[data-font="pixel"] :is(h1, h2, small, button, .aa, legend) { font-weight: 400; letter-spacing: 0; }

  .icon-btn {
    width: 56px; height: 56px; border-radius: min(50%, var(--radius)); border: 0;
    background: var(--surface); color: var(--ink);
    display: grid; place-items: center; font-size: 26px; cursor: pointer; flex: none;
    transition: transform .45s var(--spring);
    touch-action: manipulation;
  }
  .icon-btn:active { transform: scale(.88); transition-duration: .12s; }
  #open-settings svg { transition: transform .6s var(--ease-out); }
  #open-settings:active svg { transform: rotate(60deg); }

  /* ---------- картки ---------- */
  .books { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .books > li { min-width: 0; }
  .books > li:last-child { grid-column: span 2; }
  @media (min-width: 640px) {
    .books { gap: 18px; grid-template-columns: repeat(6, minmax(0, 1fr)); }
    .books > li { grid-column: span 2; }
    .books > li:nth-child(n+4) { grid-column: span 3; }
  }
  :root[data-layout="list"] .books { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  :root[data-layout="list"] .books > li { grid-column: auto; }
  @media (min-width: 900px) {
    :root[data-layout="list"] .books { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    :root[data-layout="list"] .books > li:last-child { grid-column: span 2; }
  }
  .books > li { animation: rise .6s var(--ease-out) both; animation-delay: calc(var(--n) * 55ms + 60ms); }
  .books.again > li { animation-name: rise2; animation-duration: .45s; animation-delay: calc(var(--n) * 35ms); }

  .book {
    position: relative; display: flex; flex-direction: column; gap: 18px;
    min-height: calc(180px * var(--scale)); height: 100%;
    padding: 22px; border-radius: var(--radius);
    background: var(--bg-card); color: var(--ink); text-decoration: none;
    transition: transform .5s var(--spring);
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
  }
  .book:active { transform: scale(.955); transition-duration: .14s; transition-timing-function: ease-out; }
  @media (hover: hover) {
    .book:hover { transform: translateY(-3px); }
    .book:hover .go { transform: translate(2px, -2px); }
  }
  .book:focus-visible, .icon-btn:focus-visible, .seg button:focus-visible, .done:focus-visible, .swatch:focus-visible {
    outline: 4px solid var(--focus); outline-offset: 3px;
  }

  .tile {
    width: calc(56px * var(--scale)); height: calc(56px * var(--scale));
    display: grid; place-items: center; justify-items: start; color: var(--fg);
    font-size: calc(50px * var(--scale)); flex: none;
  }
  .tile svg.i { stroke-width: 1.8; }
  .flag { width: 1.1em; height: .74em; border-radius: max(2px, calc(var(--radius) * .18)); overflow: hidden; display: block; }
  .book h2 {
    margin: auto 0 0; font-size: calc(27px * var(--scale)); line-height: 1.12; font-weight: 900;
    letter-spacing: -.01em; text-wrap: balance; min-width: 0; overflow-wrap: break-word; hyphens: auto;
  }
  :root[data-font="strict"] .book h2 { font-weight: 800; letter-spacing: -.02em; }
  .book .go {
    position: absolute; top: 20px; right: 20px; width: 44px; height: 44px; border-radius: min(50%, var(--radius-in));
    display: grid; place-items: center; font-size: 26px; color: var(--fg);
    transition: transform .4s var(--spring);
  }

  :root[data-layout="list"] .book { flex-direction: row; align-items: center; min-height: calc(104px * var(--scale)); padding: 16px 18px; }
  :root[data-layout="list"] .book h2 { margin: 0; flex: 1; }
  :root[data-layout="list"] .book .go { position: static; }

  .b-hist { --bg-card: var(--hist-bg); --fg: var(--hist-fg); }
  .b-math { --bg-card: var(--math-bg); --fg: var(--math-fg); }
  .b-tech { --bg-card: var(--tech-bg); --fg: var(--tech-fg); }
  .b-lit  { --bg-card: var(--lit-bg);  --fg: var(--lit-fg); }
  .b-ukr  { --bg-card: var(--ukr-bg);  --fg: var(--ukr-fg); }

  .note {
    margin: 0; color: var(--ink-soft); font-size: calc(15px * var(--scale)); display: flex; align-items: center; gap: 8px;
    animation: fade .6s var(--ease-out) .45s both;
  }

  @keyframes rise  { from { opacity: 0; transform: translateY(22px) scale(.97); } to { opacity: 1; transform: none; } }
  @keyframes rise2 { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: none; } }
  @keyframes fade  { from { opacity: 0; } to { opacity: 1; } }

  /* ---------- налаштування (шторка) ---------- */
  dialog {
    border: none; padding: 0; margin: auto auto 0; width: min(580px, 100%); max-width: 100%;
    max-height: calc(100% - 24px); overflow: auto; overscroll-behavior: contain;
    background: var(--surface); color: var(--ink);
    border-radius: calc(var(--radius) + 4px) calc(var(--radius) + 4px) 0 0;
  }
  @media (min-width: 640px) { dialog { margin: auto; border-radius: calc(var(--radius) + 4px); } }
  dialog::backdrop { background: rgba(0, 0, 0, .4); }
  dialog[open] { animation: sheet-in .5s var(--ease-out) both; }
  dialog[open]::backdrop { animation: fade .3s ease-out both; }
  dialog.closing { animation: sheet-out .26s cubic-bezier(.4, 0, 1, 1) both; }
  dialog.closing::backdrop { animation: fade-out .26s ease-in both; }
  @keyframes sheet-in  { from { transform: translateY(100%); } to { transform: none; } }
  @keyframes sheet-out { from { transform: none; } to { transform: translateY(100%); } }
  @media (min-width: 640px) {
    @keyframes sheet-in  { from { opacity: 0; transform: translateY(30px) scale(.96); } to { opacity: 1; transform: none; } }
    @keyframes sheet-out { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(20px) scale(.97); } }
  }
  @keyframes fade-out { from { opacity: 1; } to { opacity: 0; } }

  .grabber { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 8px auto -10px; }
  @media (min-width: 640px) { .grabber { display: none; } }
  .sheet { display: grid; gap: 20px; padding: 20px 20px calc(env(safe-area-inset-bottom, 0px) + 22px); }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .sheet h2 { margin: 0; font-size: calc(28px * var(--scale)); font-weight: 900; letter-spacing: -.01em; }
  .sheet .icon-btn { background: var(--seg-bg); width: 48px; height: 48px; font-size: 22px; }
  fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 8px; min-width: 0; }
  legend { padding: 0 0 8px 4px; font-size: calc(15px * var(--scale)); font-weight: 700; color: var(--ink-soft); }

  /* сегментований перемикач у стилі iOS: повзунок їде через transform */
  .seg {
    --n: 3; --i: 0;
    position: relative; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr));
    padding: 4px; border-radius: var(--radius-ui); background: var(--seg-bg);
  }
  .seg::before {
    content: ""; position: absolute; top: 4px; bottom: 4px; left: 4px;
    width: calc((100% - 8px) / var(--n)); border-radius: max(3px, calc(var(--radius-ui) - 4px)); background: var(--seg-thumb);
    box-shadow: 0 2px 8px rgba(0, 0, 0, .12);
    transform: translateX(calc(100% * var(--i)));
    transition: transform .4s var(--ease-out);
  }
  .seg button {
    position: relative; z-index: 1;
    min-height: 58px; padding: 6px 4px; border-radius: max(3px, calc(var(--radius-ui) - 4px)); border: 0;
    background: transparent; color: var(--ink-soft); cursor: pointer;
    font: inherit; font-size: calc(15px * var(--scale)); font-weight: 700; line-height: 1.15;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    touch-action: manipulation; transition: color .25s ease, transform .3s var(--spring);
  }
  .seg button:active { transform: scale(.94); }
  .seg button[aria-pressed="true"] { color: var(--ink); }
  .seg button svg.i { font-size: 22px; }
  .seg button[data-font="soft"]   { font-family: var(--font-soft); }
  .seg button[data-font="strict"] { font-family: var(--font-strict); }
  .seg button[data-font="pixel"]  { font-family: var(--font-pixel); font-synthesis: none; }
  .seg button[data-font="pixel"], .seg button[data-font="pixel"] .aa { font-weight: 400; }
  .seg .aa { font-size: calc(22px * var(--scale)); line-height: 1; font-weight: 800; }
  .seg .shape { width: 24px; height: 24px; border: 2.5px solid currentColor; display: block; }

  /* кольори */
  .swatches { display: flex; flex-wrap: wrap; gap: 10px; }
  .swatch {
    position: relative; width: 52px; height: 52px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
    background: var(--c); color: #fff; display: grid; place-items: center; font-size: 24px;
    transition: transform .35s var(--spring); touch-action: manipulation;
  }
  .swatch:active { transform: scale(.88); transition-duration: .12s; }
  .swatch::after {
    content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 3px solid var(--ink);
    opacity: 0; transform: scale(.85); transition: opacity .2s ease, transform .35s var(--spring);
  }
  .swatch[aria-pressed="true"]::after { opacity: 1; transform: none; }
  .swatch svg.i { stroke-width: 3; opacity: 0; transform: scale(.5); transition: opacity .2s ease, transform .35s var(--spring); }
  .swatch[aria-pressed="true"] svg.i { opacity: 1; transform: none; }
  .swatch.multi { background: conic-gradient(#FFAE5E, #FFD84D, #5FDDB1, #8FB4FF, #FF92C6, #FFAE5E); }
  .swatch.custom { background: conic-gradient(from 90deg, #ff3b30, #ffcc00, #34c759, #00c7be, #007aff, #af52de, #ff3b30); }
  .swatch.custom .plus { width: 30px; height: 30px; border-radius: 50%; background: #fff; color: #111; display: grid; place-items: center; font-size: 18px; pointer-events: none; }
  .swatch.custom .plus svg.i { opacity: 1; transform: none; stroke-width: 2.6; }
  .swatch.custom[aria-pressed="true"] .plus { background: var(--c); color: #fff; }
  .swatch.custom .plus svg.i { transition: transform .35s var(--spring); }
  .swatch.custom[aria-expanded="true"] .plus svg.i { transform: rotate(45deg); }

  /* власна палітра: квадрат насиченість/яскравість + смуга відтінку + HEX */
  .picker {
    display: grid; gap: 14px; padding: 14px; margin-top: 6px; min-width: 0;
    border-radius: var(--radius-ui); background: var(--seg-bg);
    animation: rise .4s var(--ease-out) both;
  }
  .picker[hidden] { display: none; }
  .sv {
    --hue-c: #0A7CFF;
    position: relative; height: 190px; border-radius: max(6px, calc(var(--radius-ui) - 6px)); cursor: crosshair;
    background: linear-gradient(to top, #000, rgba(0, 0, 0, 0)), linear-gradient(to right, #fff, var(--hue-c));
    touch-action: none;
  }
  .hue {
    position: relative; height: 34px; border-radius: max(6px, min(17px, calc(var(--radius-ui) - 6px))); cursor: pointer;
    background: linear-gradient(to right, #f00 0%, #ff0 16.66%, #0f0 33.33%, #0ff 50%, #00f 66.66%, #f0f 83.33%, #f00 100%);
    touch-action: none;
  }
  .knob {
    position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%;
    border: 3px solid #fff; background: var(--k, #fff); pointer-events: none;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, .25), 0 2px 6px rgba(0, 0, 0, .35);
    transition: transform .2s var(--spring);
  }
  .hue .knob { top: 50%; }
  .dragging .knob { transform: scale(1.18); }
  .picker-row { display: flex; align-items: center; gap: 12px; }
  .picker-row .preview { width: 48px; height: 48px; border-radius: 50%; background: var(--k, #0A7CFF); flex: none; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12); }
  .picker-row label { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--ink-soft); }
  .picker-row input {
    flex: 1 1 0; width: 0; min-width: 0; height: 48px; padding: 0 14px; border-radius: max(6px, calc(var(--radius-ui) - 6px));
    border: 2px solid var(--line); background: var(--surface); color: var(--ink);
    font: inherit; font-size: 18px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    font-variant-numeric: tabular-nums;
  }
  .picker-row input:focus { outline: none; border-color: var(--accent); }
  .picker-row input[aria-invalid="true"] { border-color: #E5484D; }

  /* ---------- підвал ---------- */
  .credit {
    margin-top: auto; display: flex; align-items: center; gap: 14px; padding-top: 20px; border-top: 1px solid var(--line);
    color: var(--ink-soft); font-size: calc(15px * var(--scale));
    animation: fade .6s var(--ease-out) .55s both;
  }
  .credit b { color: var(--ink); font-weight: 800; }

  .done {
    min-height: 58px; border-radius: var(--radius-ui); border: 0; background: var(--accent); color: #fff;
    font: inherit; font-size: calc(18px * var(--scale)); font-weight: 800; cursor: pointer;
    transition: transform .4s var(--spring); touch-action: manipulation;
  }
  .done:active { transform: scale(.96); transition-duration: .12s; }
  :root[data-theme="dark"] .done { color: #0B0B0D; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .done { color: #0B0B0D; } }

  /* телефон: компактні плитки по 2 в ряд */
  @media (max-width: 639px) {
    .wrap { gap: 20px; }
    .book { min-height: calc(138px * var(--scale)); padding: 16px; gap: 12px; border-radius: min(var(--radius), 26px); }
    .tile { font-size: calc(38px * var(--scale)); width: calc(44px * var(--scale)); height: calc(44px * var(--scale)); }
    .book h2 { font-size: calc(clamp(15px, 5vw, 24px) * var(--scale)); hyphens: manual; }
  }
  @media (max-width: 360px) {
    .book { padding: 14px; }
    .book .go { top: 12px; right: 10px; font-size: 22px; width: 36px; height: 36px; }
    :root[data-layout="list"] .book { min-height: calc(84px * var(--scale)); padding: 14px 16px; }
    .icon-btn { width: 52px; height: 52px; font-size: 24px; }
    .sheet { padding-inline: 16px; gap: 18px; }
    .seg button { font-size: calc(13px * var(--scale)); min-height: 54px; overflow-wrap: anywhere; }
    .swatches { gap: 8px; }
    .swatch { width: 44px; height: 44px; }
  }
  /* ПК: більше повітря і крупніші картки */
  @media (min-width: 1100px) {
    body { padding-block: calc(env(safe-area-inset-top, 0px) + 48px) calc(env(safe-area-inset-bottom, 0px) + 40px); }
    .wrap { gap: 32px; }
    .book { min-height: calc(220px * var(--scale)); padding: 28px; }
    .book h2 { font-size: calc(32px * var(--scale)); }
    .tile { font-size: calc(58px * var(--scale)); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after, dialog::backdrop { transition: none !important; animation: none !important; }
  }
</style>

<script>
  (function () {
    var s = PIDR.s;
    var dlg = document.getElementById('settings');
    var books = document.getElementById('books');
    var swatches = document.querySelectorAll('#swatches .swatch[data-color]');
    var customBtn = document.getElementById('color-custom');

    function apply(noSave) {
      PIDR.applyRoot(s);
      document.querySelectorAll('.seg').forEach(function (seg) {
        var btns = seg.querySelectorAll('button');
        seg.style.setProperty('--n', btns.length);
        btns.forEach(function (b, i) {
          var on = b.dataset.value === s[seg.dataset.key];
          b.setAttribute('aria-pressed', String(on));
          if (on) seg.style.setProperty('--i', i);
        });
      });
      var preset = false;
      swatches.forEach(function (b) {
        var on = b.dataset.color.toLowerCase() === s.color.toLowerCase();
        if (on) preset = true;
        b.setAttribute('aria-pressed', String(on));
      });
      customBtn.setAttribute('aria-pressed', String(!preset));
      if (!preset) customBtn.style.setProperty('--c', s.color);
      if (!noSave) PIDR.save(s);
    }

    // Коротка повторна поява карток, коли змінюється їхній вигляд
    function replay() {
      books.classList.remove('again');
      void books.offsetWidth;
      books.classList.add('again');
    }

    document.querySelectorAll('.seg').forEach(function (seg) {
      seg.addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (!b || s[seg.dataset.key] === b.dataset.value) return;
        s[seg.dataset.key] = b.dataset.value;
        apply();
        if (seg.dataset.key === 'layout' || seg.dataset.key === 'size') replay();
      });
    });

    swatches.forEach(function (b) {
      b.addEventListener('click', function () {
        s.color = b.dataset.color; apply();
        if (s.color !== 'multi') syncPicker(s.color);
      });
    });

    /* ---------- власна палітра ---------- */
    var picker = document.getElementById('picker');
    var sv = document.getElementById('sv'), svKnob = document.getElementById('sv-knob');
    var hue = document.getElementById('hue'), hueKnob = document.getElementById('hue-knob');
    var hexIn = document.getElementById('hex'), preview = document.getElementById('preview');
    var H = 212, S = 1, V = 1;   // відтінок 0–360, насиченість і яскравість 0–1

    function hsvToHex(h, sat, val) {
      function f(n) { var k = (n + h / 60) % 6; return (val - val * sat * Math.max(Math.min(k, 4 - k, 1), 0)) * 255; }
      return PIDR.hex([f(5), f(3), f(1)]);
    }
    function hexToHsv(hx) {
      var c = PIDR.rgb(hx), r = c[0] / 255, g = c[1] / 255, b = c[2] / 255;
      var mx = Math.max(r, g, b), d = mx - Math.min(r, g, b), h = 0;
      if (d) h = mx === r ? (g - b) / d : mx === g ? 2 + (b - r) / d : 4 + (r - g) / d;
      h *= 60; if (h < 0) h += 360;
      return [h, mx ? d / mx : 0, mx];
    }
    function paint() {
      var cur = hsvToHex(H, S, V);
      sv.style.setProperty('--hue-c', 'hsl(' + H + ',100%,50%)');
      svKnob.style.left = (S * 100) + '%';
      svKnob.style.top = ((1 - V) * 100) + '%';
      svKnob.style.setProperty('--k', cur);
      hueKnob.style.left = (H / 360 * 100) + '%';
      hueKnob.style.setProperty('--k', 'hsl(' + H + ',100%,50%)');
      preview.style.setProperty('--k', cur);
      if (document.activeElement !== hexIn) { hexIn.value = cur.toUpperCase(); hexIn.removeAttribute('aria-invalid'); }
    }
    function syncPicker(hx) { var v = hexToHsv(hx); if (v[1] > 0.02) H = v[0]; S = v[1]; V = v[2]; paint(); }

    // зміни під час перетягування застосовуємо раз на кадр — плавно і без зайвої роботи
    var pending = false;
    function commit(save) {
      s.color = hsvToHex(H, S, V);
      paint();
      if (save) { apply(); return; }
      if (pending) return;
      pending = true;
      requestAnimationFrame(function () { pending = false; apply(true); });
    }
    function draggable(el, move) {
      el.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        var r = el.getBoundingClientRect();
        try { el.setPointerCapture(e.pointerId); } catch (err) {}
        el.classList.add('dragging');
        function mv(ev) { move(Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (ev.clientY - r.top) / r.height))); commit(false); }
        function up() {
          el.classList.remove('dragging');
          el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up);
          commit(true);
        }
        el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
        mv(e);
      });
    }
    draggable(sv, function (x, y) { S = x; V = 1 - y; });
    draggable(hue, function (x) { H = Math.min(359.9, x * 360); });

    hexIn.addEventListener('input', function () {
      var v = hexIn.value.trim(); if (v[0] !== '#') v = '#' + v;
      if (/^#[0-9a-f]{6}$/i.test(v)) {
        hexIn.removeAttribute('aria-invalid');
        var hsv = hexToHsv(v); if (hsv[1] > 0.02) H = hsv[0]; S = hsv[1]; V = hsv[2];
        s.color = v.toLowerCase(); paint(); apply();
      } else hexIn.setAttribute('aria-invalid', 'true');
    });
    hexIn.addEventListener('blur', paint);

    customBtn.addEventListener('click', function () {
      var open = picker.hidden;
      picker.hidden = !open;
      customBtn.setAttribute('aria-expanded', String(open));
      if (open) {
        syncPicker(s.color === 'multi' ? '#0a7cff' : s.color);
        if (s.color === 'multi') commit(true);   // одразу показуємо, як виглядатиме один колір
      }
    });

    document.getElementById('open-settings').addEventListener('click', function () {
      dlg.classList.remove('closing');
      if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
    });

    // Плавне закриття: спершу анімація, потім close()
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    function closeSheet() {
      if (!dlg.open || dlg.classList.contains('closing')) return;
      if (reduce) { dlg.close(); return; }
      dlg.classList.add('closing');
      var done = false;
      function finish() { if (done) return; done = true; dlg.classList.remove('closing'); dlg.close(); }
      dlg.addEventListener('animationend', function (e) { if (e.target === dlg) finish(); });
      setTimeout(finish, 400);
    }
    dlg.querySelector('form').addEventListener('submit', function (e) { e.preventDefault(); closeSheet(); });
    dlg.addEventListener('cancel', function (e) { e.preventDefault(); closeSheet(); });
    dlg.addEventListener('click', function (e) { if (e.target === dlg) closeSheet(); });

    apply();
  })();
</script>
</body>
</html>
