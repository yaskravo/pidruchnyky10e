<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Підручники 10 клас</title>
<meta name="description" content="Усі підручники 10 класу на одній сторінці: великі кнопки, зручно на планшеті.">
<meta name="theme-color" content="#EEF2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11151C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@400;700&family=Manrope:wght@500;700;800&family=Nunito:wght@600;800;900&display=swap">
<script>
  /* Застосовуємо збережені налаштування до першого малювання, щоб не було «блимання». */
  (function () {
    var d = document.documentElement, s = {};
    try { s = JSON.parse(localStorage.getItem('pidruchnyky-settings') || '{}') || {}; } catch (e) {}
    if (s.theme === 'light' || s.theme === 'dark') d.setAttribute('data-theme', s.theme);
    d.setAttribute('data-font', s.font || 'cartoon');
    d.setAttribute('data-layout', s.layout || 'grid');
    d.setAttribute('data-size', s.size || 'normal');
  })();
</script>
<style>
  /* Макет: одна колонка «дошка» з великими плитками-кнопками; на планшеті 2–3 в ряд, на телефоні — 1. */
  :root {
    --bg: #EEF2F7;          /* холодний «паперовий» фон */
    --surface: #FFFFFF;
    --ink: #18202E;
    --ink-soft: #5A6578;
    --line: #D8DFEA;
    --accent: #2F6FEB;
    --focus: #2F6FEB;
    --shadow: 0 1px 0 rgba(24, 32, 46, .04), 0 6px 18px -8px rgba(24, 32, 46, .18);
    --shadow-press: 0 1px 0 rgba(24, 32, 46, .04), 0 2px 6px -3px rgba(24, 32, 46, .2);

    /* кольори предметів: фон плитки-іконки / колір іконки */
    --hist-bg: #FDEBD3;  --hist-fg: #B4590B;
    --math-bg: #DCE8FF;  --math-fg: #1F5BD6;
    --tech-bg: #D6F3EA;  --tech-fg: #0C7A5B;
    --lit-bg:  #F6DDEA;  --lit-fg:  #A3326C;
    --ukr-bg:  #FFF1BF;  --ukr-fg:  #8A6500;

    --font-cartoon: "Balsamiq Sans", "Comic Sans MS", "Chalkboard SE", ui-rounded, system-ui, sans-serif;
    --font-soft: "Nunito", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    --font-strict: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
    --font: var(--font-cartoon);
    --scale: 1;
    --radius: 26px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11151C; --surface: #1A2029; --ink: #EEF2F8; --ink-soft: #9AA5B8; --line: #2A3240;
      --accent: #6E9BFF; --focus: #8FB2FF;
      --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 22px -10px rgba(0,0,0,.7);
      --shadow-press: 0 1px 0 rgba(0,0,0,.3), 0 2px 6px -3px rgba(0,0,0,.6);
      --hist-bg: #3A2814; --hist-fg: #F5A65B;
      --math-bg: #1C2B4A; --math-fg: #8DB0FF;
      --tech-bg: #133A30; --tech-fg: #5ED6AE;
      --lit-bg:  #3B1D2D; --lit-fg:  #F08BBE;
      --ukr-bg:  #3A3110; --ukr-fg:  #F3CF4B;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11151C; --surface: #1A2029; --ink: #EEF2F8; --ink-soft: #9AA5B8; --line: #2A3240;
    --accent: #6E9BFF; --focus: #8FB2FF;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 22px -10px rgba(0,0,0,.7);
    --shadow-press: 0 1px 0 rgba(0,0,0,.3), 0 2px 6px -3px rgba(0,0,0,.6);
    --hist-bg: #3A2814; --hist-fg: #F5A65B;
    --math-bg: #1C2B4A; --math-fg: #8DB0FF;
    --tech-bg: #133A30; --tech-fg: #5ED6AE;
    --lit-bg:  #3B1D2D; --lit-fg:  #F08BBE;
    --ukr-bg:  #3A3110; --ukr-fg:  #F3CF4B;
    color-scheme: dark;
  }
  :root[data-font="soft"]   { --font: var(--font-soft); }
  :root[data-font="strict"] { --font: var(--font-strict); --radius: 18px; }
  :root[data-size="large"]  { --scale: 1.18; }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: calc(17px * var(--scale));
    line-height: 1.4;
    -webkit-tap-highlight-color: transparent;
    padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
    padding-block: calc(env(safe-area-inset-top, 0px) + 20px) calc(env(safe-area-inset-bottom, 0px) + 32px);
  }
  .wrap { max-width: 1040px; margin-inline: auto; display: grid; gap: 28px; }

  svg.i { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---------- шапка ---------- */
  header { display: flex; align-items: center; gap: 16px; }
  .brand { flex: 1; min-width: 0; display: grid; gap: 2px; }
  .brand small {
    font-size: calc(13px * var(--scale)); font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
    color: var(--ink-soft);
  }
  h1 { margin: 0; font-size: calc(clamp(30px, 6vw, 44px) * var(--scale)); line-height: 1.05; font-weight: 800; text-wrap: balance; }
  :root[data-font="cartoon"] h1 { font-weight: 700; }

  .icon-btn {
    width: 60px; height: 60px; border-radius: 20px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink); box-shadow: var(--shadow);
    display: grid; place-items: center; font-size: 28px; cursor: pointer; flex: none;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .icon-btn:active { transform: scale(.95); box-shadow: var(--shadow-press); }

  /* ---------- плитки ---------- */
  .books { list-style: none; margin: 0; padding: 0; display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); }
  :root[data-layout="list"] .books { grid-template-columns: 1fr; gap: 14px; }

  .book {
    position: relative; display: flex; flex-direction: column; gap: 18px;
    min-height: calc(200px * var(--scale)); height: 100%;
    padding: 24px; border-radius: var(--radius);
    background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow);
    color: inherit; text-decoration: none;
    transition: transform .14s ease, box-shadow .14s ease, border-color .14s ease;
    touch-action: manipulation;
  }
  .book:hover { border-color: color-mix(in srgb, var(--fg) 45%, var(--line)); }
  .book:active { transform: scale(.975); box-shadow: var(--shadow-press); }
  .book:focus-visible, .icon-btn:focus-visible, .seg button:focus-visible, .done:focus-visible {
    outline: 4px solid var(--focus); outline-offset: 3px;
  }

  .tile {
    width: calc(76px * var(--scale)); height: calc(76px * var(--scale)); border-radius: calc(var(--radius) - 6px);
    display: grid; place-items: center; background: var(--bg-tile); color: var(--fg);
    font-size: calc(40px * var(--scale)); flex: none;
  }
  .tile svg.i { stroke-width: 1.9; }
  .book .text { display: grid; gap: 4px; min-width: 0; margin-top: auto; }
  .book h2 { margin: 0; font-size: calc(26px * var(--scale)); line-height: 1.15; font-weight: 800; text-wrap: balance; }
  :root[data-font="cartoon"] .book h2 { font-weight: 700; }
  .book .src { color: var(--ink-soft); font-size: calc(15px * var(--scale)); display: flex; align-items: center; gap: 6px; }
  .book .go {
    position: absolute; top: 22px; right: 22px; width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center; font-size: 22px; color: var(--fg); background: var(--bg-tile);
  }

  :root[data-layout="list"] .book { flex-direction: row; align-items: center; min-height: calc(112px * var(--scale)); padding: 18px 20px; }
  :root[data-layout="list"] .book .text { margin-top: 0; flex: 1; }
  :root[data-layout="list"] .book .go { position: static; }

  .b-hist { --bg-tile: var(--hist-bg); --fg: var(--hist-fg); }
  .b-math { --bg-tile: var(--math-bg); --fg: var(--math-fg); }
  .b-tech { --bg-tile: var(--tech-bg); --fg: var(--tech-fg); }
  .b-lit  { --bg-tile: var(--lit-bg);  --fg: var(--lit-fg); }
  .b-ukr  { --bg-tile: var(--ukr-bg);  --fg: var(--ukr-fg); }

  .note { margin: 0; color: var(--ink-soft); font-size: calc(15px * var(--scale)); display: flex; align-items: center; gap: 8px; }

  /* ---------- налаштування ---------- */
  dialog {
    border: none; padding: 0; margin: auto auto 0; width: min(560px, 100%);
    max-height: calc(100% - 24px); overflow: auto;
    background: var(--surface); color: var(--ink);
    border-radius: 28px 28px 0 0; box-shadow: 0 -10px 40px -10px rgba(0,0,0,.35);
  }
  @media (min-width: 640px) { dialog { margin: auto; border-radius: 28px; } }
  dialog::backdrop { background: rgba(10, 14, 20, .45); }
  dialog[open] { animation: up .22s ease-out; }
  @keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
  .sheet { display: grid; gap: 22px; padding: 24px 20px calc(env(safe-area-inset-bottom, 0px) + 22px); }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .sheet h2 { margin: 0; font-size: calc(26px * var(--scale)); font-weight: 800; }
  fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 10px; min-width: 0; }
  legend {
    padding: 0; margin-bottom: 10px; font-size: calc(13px * var(--scale)); font-weight: 800;
    letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft);
  }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
  .seg button {
    min-height: 64px; padding: 8px 10px; border-radius: 18px; border: 2px solid var(--line);
    background: var(--bg); color: var(--ink); cursor: pointer;
    font: inherit; font-size: calc(16px * var(--scale)); font-weight: 700;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    touch-action: manipulation; transition: border-color .12s ease, background .12s ease;
  }
  .seg button svg.i { font-size: 22px; }
  .seg button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--surface)); color: var(--ink); }
  .seg button[data-font="cartoon"] { font-family: var(--font-cartoon); }
  .seg button[data-font="soft"]    { font-family: var(--font-soft); }
  .seg button[data-font="strict"]  { font-family: var(--font-strict); }
  .seg .aa { font-size: calc(24px * var(--scale)); line-height: 1; }
  .done {
    min-height: 60px; border-radius: 18px; border: 0; background: var(--accent); color: #fff;
    font: inherit; font-size: calc(18px * var(--scale)); font-weight: 800; cursor: pointer;
  }
  :root[data-theme="dark"] .done { color: #0B1220; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .done { color: #0B1220; } }

  @media (max-width: 420px) {
    .book { min-height: calc(168px * var(--scale)); padding: 20px; }
    .book h2 { font-size: calc(23px * var(--scale)); }
    .seg button { font-size: calc(14px * var(--scale)); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>

<div class="wrap">

    <div class="brand">
      <small>10 клас</small>
      <h1>Підручники</h1>
    </div>
    <button class="icon-btn" id="open-settings" type="button" aria-label="Налаштування" aria-haspopup="dialog">
      <svg class="i"><use href="#i-gear"/></svg>
    </button>
  </header>

  <main>
    <ul class="books">
      <li><a class="book b-hist" href="https://drive.google.com/file/d/1q4nO1a97Egmbeb3jZPUGlnkPiwxXa89s/view" target="_blank" rel="noopener">
        <span class="tile"><svg class="i"><use href="#i-history"/></svg></span>
        <div class="text"><h2>Історія</h2><span class="src"><svg class="i"><use href="#i-file"/></svg>Google Диск · PDF</span></div>

      <li><a class="book b-math" href="https://drive.google.com/file/d/14jrMP4ftrvDGHu_lAiJOt7P1BWLHtEIQ/view" target="_blank" rel="noopener">
        <span class="tile"><svg class="i"><use href="#i-math"/></svg></span>

        <span class="go" aria-hidden="true"><svg class="i"><use href="#i-open"/></svg></span>
      </a></li>

<dialog id="settings" aria-labelledby="settings-title">
  <form class="sheet" method="dialog">
    <div class="sheet-head">
      <h2 id="settings-title">Налаштування</h2>
      <button class="icon-btn" type="submit" aria-label="Закрити"><svg class="i"><use href="#i-close"/></svg></button>
    </div>

    <fieldset>
      <legend>Шрифт</legend>
      <div class="seg" data-key="font">
        <button type="button" id="font-cartoon" data-value="cartoon" data-font="cartoon"><span class="aa">Аа</span>Мультяшний</button>
        <button type="button" id="font-soft" data-value="soft" data-font="soft"><span class="aa">Аа</span>М'який</button>
        <button type="button" id="font-strict" data-value="strict" data-font="strict"><span class="aa">Аа</span>Строгий</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Тема</legend>
      <div class="seg" data-key="theme">
        <button type="button" id="theme-auto" data-value="auto"><svg class="i"><use href="#i-auto"/></svg>Як на пристрої</button>
        <button type="button" id="theme-light" data-value="light"><svg class="i"><use href="#i-sun"/></svg>Світла</button>
        <button type="button" id="theme-dark" data-value="dark"><svg class="i"><use href="#i-moon"/></svg>Темна</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Вигляд</legend>
      <div class="seg" data-key="layout">
        <button type="button" id="layout-grid" data-value="grid"><svg class="i"><use href="#i-grid"/></svg>Плитки</button>
        <button type="button" id="layout-list" data-value="list"><svg class="i"><use href="#i-list"/></svg>Список</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Розмір</legend>
      <div class="seg" data-key="size">
        <button type="button" id="size-normal" data-value="normal"><span class="aa" style="font-size:18px">Аа</span>Звичайний</button>
        <button type="button" id="size-large" data-value="large"><span class="aa" style="font-size:26px">Аа</span>Великий</button>
      </div>
    </fieldset>

    <button class="done" type="submit">Готово</button>
  </form>
</dialog>

<script>
  (function () {
    var KEY = 'pidruchnyky-settings';
    var root = document.documentElement;
    var dlg = document.getElementById('settings');
    var defaults = { font: 'cartoon', theme: 'auto', layout: 'grid', size: 'normal' };
    var s = {};
    try { s = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
    for (var k in defaults) if (!s[k]) s[k] = defaults[k];

    function apply() {
      if (s.theme === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', s.theme);
      root.setAttribute('data-font', s.font);
      root.setAttribute('data-layout', s.layout);
      root.setAttribute('data-size', s.size);
      document.querySelectorAll('.seg').forEach(function (seg) {
        seg.querySelectorAll('button').forEach(function (b) {
          b.setAttribute('aria-pressed', String(b.dataset.value === s[seg.dataset.key]));
        });
      });
      try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}
    }

    document.querySelectorAll('.seg').forEach(function (seg) {
      seg.addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        s[seg.dataset.key] = b.dataset.value;
        apply();
      });
    });

    document.getElementById('open-settings').addEventListener('click', function () {
      if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
    });
    // Закриття по тапу на затемнений фон
    dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });

    apply();
  })();
</script>
</body>
</html>
